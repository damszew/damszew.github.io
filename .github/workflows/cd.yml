on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

name: CD

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📂 setup
        uses: actions/checkout@v7
      - name: 🔨 build
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@12.9.0

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 deploy
        id: deployment
        uses: actions/deploy-pages@v5
